<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>OR 찍고 밥먹자</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #ece9e6, #ffffff);
            transition: background-color 0.5s ease;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            transition: background-color 0.5s ease;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #4A90E2;
            outline: none;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #357ABD;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container" id="card">
        <h1>🎓 학번을 입력하세요</h1>
        <p>학번을 입력하세요 (예: 3학년은 3으로 시작)</p>
        <input type="text" id="studentId" placeholder="예: 30712">
        <button onclick="checkGrade()">입장 확인</button>
        <div id="result"></div>
        <a href="sms:01012345678?body=인증번호는 123456입니다">문자 보내기</a>

    </div>

    <script>
        function checkGrade() {
            const id = document.getElementById("studentId").value.trim();
            const result = document.getElementById("result");
            const body = document.body;
            const card = document.getElementById("card");

            const resetBackground = () => {
                body.style.background = "#ffe6e6";
                card.style.backgroundColor = "#fff0f0";
            };

            if (!/^\d{5}$/.test(id)) {
                resetBackground();
                result.innerText = "❌ 학번은 정확히 5자리 숫자여야 합니다.";
                return;
            }

            const grade = id.charAt(0);
            if (!['1', '2', '3'].includes(grade)) {
                resetBackground();
                result.innerText = "❌ 첫 번째 자리는 1, 2, 또는 3이어야 합니다.";
                return;
            }

            const second = id.charAt(1);
            if (second !== '0') {
                resetBackground();
                result.innerText = "❌ 두 번째 자리는 반드시 0이어야 합니다.";
                return;
            }

            // 통과했을 때 배경 및 메시지
            if (grade === "3") {
                body.style.background = "#D0E6FF"; // 연파랑
                card.style.backgroundColor = "#E6F0FF";
                result.innerText = "🔵 3학년입니다. 먼저 식사하세요!";
            } else if (grade === "2") {
                body.style.background = "#FFE6C7"; // 연주황
                card.style.backgroundColor = "#FFF3E0";
                result.innerText = "🟠 2학년입니다. 다음 차례입니다.";
            } else if (grade === "1") {
                body.style.background = "#F0F0F0"; // 연회색
                card.style.backgroundColor = "#FAFAFA";
                result.innerText = "⚪ 1학년입니다. 마지막 차례입니다.";
            }
        }

    </script>
</body>

</html>
