<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome QR Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-200 via-white to-purple-200 flex items-center justify-center h-screen">

  <div class="bg-white shadow-2xl rounded-2xl p-10 text-center max-w-md w-full">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">사랑합니다!</h1>
    <p class="text-gray-600 mb-6">QR 코드를 스캔해 학생증 찍고 밥먹자!</p>

    <!-- QR 코드 정중앙 배치 -->
    <div id="qrcode" class="flex justify-center mb-6">
      <img src="image/qrcode.png" alt="">
    </div>

    <button 
      onclick="location.href='http://127.0.0.1:5500/index.html'" 
      class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-full transition">
      바로 입장하기
    </button>
  </div>

  <script>
    const qrcodeContainer = document.getElementById('qrcode');

    QRCode.toCanvas(targetURL, { width: 200 }, function (error, canvas) {
      if (error) {
        console.error(error);
        return;
      }
      qrcodeContainer.appendChild(canvas); // QR 코드 캔버스를 중앙 div에 추가
    });
  </script>

</body>
</html>
