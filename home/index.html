<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>급식 체크 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-100 min-h-screen flex flex-col items-center justify-start p-6">

  <!-- Navigation -->
  <nav class="w-full max-w-6xl flex justify-between items-center py-4 px-4 bg-yellow-300 rounded-lg shadow mb-8">
    <div class="text-xl font-bold text-yellow-800">🍚 급식체크</div>
    <div class="space-x-4 text-yellow-900 font-medium">
      <a href="#" class="hover:underline">홈</a>
      <a href="#" class="hover:underline">입장확인</a>
      <a href="#" class="hover:underline">관리자</a>
    </div>
  </nav>

  <!-- Grid Layout -->
  <section class="grid grid-cols-4 gap-4 max-w-6xl w-full">

    <!-- 안내 블록 -->
    <div class="col-span-3 row-span-2 bg-yellow-200 p-6 rounded-xl shadow flex flex-col justify-center">
      <h1 class="text-4xl font-bold text-yellow-900 leading-snug">
        오늘의 급식 체크<br>입장 가능 시간 확인하세요 🍱
      </h1>
      <p class="mt-4 text-yellow-800 text-lg max-w-xl">
        3학년은 13:00부터, 2학년은 13:09부터 학과별 시간에 맞춰 입장 가능합니다. <br/>
        학생회 및 스포츠 클럽은 우선 입장 가능합니다.
      </p>
    </div>

    <!-- 이미지 자리 -->
    <div class="col-span-1 row-span-2 bg-yellow-300 rounded-xl shadow flex items-center justify-center">
      <div class="text-6xl">🍛</div>
    </div>

    <!-- 급식 정보 카드 -->
    <div class="col-span-2 row-span-1 bg-yellow-100 rounded-xl shadow h-40 p-4 flex flex-col justify-center">
      <h2 class="text-xl font-bold text-yellow-800">입장 시간 안내</h2>
      <ul class="text-yellow-700 mt-2 text-sm list-disc list-inside">
        <li>3학년: 전자(13:00), 스마트(13:02), 디자인(13:04), 소프트(13:06), 자유입장(13:09~)</li>
        <li>2학년: 전자(13:10), 스마트(13:12), 디자인(13:14), 소프트(13:16)</li>
      </ul>
    </div>

    <!-- 버튼 -->
    <div class="col-span-1 row-span-1 bg-yellow-200 rounded-xl shadow flex items-center justify-center flex-col h-40">
      <button onclick="location.href='http://127.0.0.1:5500/index.html'" class="bg-white text-yellow-700 font-semibold px-4 py-2 rounded-full shadow hover:bg-yellow-50 transition">
        🍽️ OR 코드 찍기
      </button>
    </div>
  </section>

</body>
</html>
