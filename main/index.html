<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>OR 찍고 밥먹자</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #ece9e6, #ffffff);
            transition: background-color 0.5s ease;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            transition: background-color 0.5s ease;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 16px;
        }

        input {
            border: 2px solid #ccc;
        }

        input:focus {
            border-color: #4A90E2;
            outline: none;
        }

        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #357ABD;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .id-card {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background-color: #f9f9f9;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .id-card img {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            float: right;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            text-decoration: none;
            color: #4A90E2;
            margin: 0 10px;
        }

        .home-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4A90E2;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .home-button:hover {
            background-color: #357ABD;
        }

        #goEatBtn {
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container" id="card">
        <h1>🎓 학번을 입력하세요</h1>
        <input type="text" id="studentId" placeholder="예: 30712">
        <button onclick="checkGrade()">학생증 확인</button>

        <div id="result"></div>
        <div id="idCard"></div>
        <button id="goEatBtn" style="display: none;" onclick="goToLunch()">🍽️ 밥 먹으러 가기</button>


        <div class="links">
            <a href="http://127.0.0.1:5500/food/index.html">📋 급식표</a>
            <a href="http://127.0.0.1:5500/main/School%20lunch/index.html">📌 급식 순서표</a>
        </div>
    </div>

    <script>
        function getCurrentTimeInfo() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            return { hours, minutes };
        }

        function minutesUntil(targetHour, targetMinute) {
            const now = new Date();
            const target = new Date();
            target.setHours(targetHour, targetMinute, 0, 0);
            const diff = (target - now) / 60000;
            return Math.ceil(diff);
        }

        let misuseCount = 0;

        function checkGrade() {
            const id = document.getElementById("studentId").value.trim();
            const result = document.getElementById("result");
            const idCard = document.getElementById("idCard");
            const body = document.body;
            const card = document.getElementById("card");
            const goEatBtn = document.getElementById("goEatBtn");

            idCard.innerHTML = "";
            goEatBtn.style.display = "none";

            const resetBackground = () => {
                body.style.background = "#ffe6e6";
                card.style.backgroundColor = "#fff0f0";
            };

            if (!/^\d{5}$/.test(id)) {
                resetBackground();
                result.innerText = "❌ 학번은 정확히 5자리 숫자여야 합니다.";
                return;
            }

            const grade = id.charAt(0);
            const current = getCurrentTimeInfo();

            const allowTimes = {
                "3": { hour: 13, minute: 0 },
                "2": { hour: 13, minute: 6 },
                "1": { hour: 13, minute: 10 }
            };

            // 우선급식 여부 확인
            const isPriority = confirm("우선 급식권이 있나요?");
            if (isPriority) {
                const isSports = confirm("점심 스포츠 클럽인가요?");
                if (isSports) {
                    const sport = prompt("스포츠 종목을 입력하세요 (배구, 배드민턴, 농구, 걸스포츠)").trim();
                    const day = ["일", "월", "화", "수", "목", "금", "토"][new Date().getDay()];
                    const allowedDays = {
                        "배구": ["월"],
                        "배드민턴": ["화", "금"],
                        "농구": ["목"],
                        "걸스포츠": ["수"]
                    };

                    if (!allowedDays[sport]) {
                        result.innerText = "❌ 등록되지 않은 종목입니다.";
                        return;
                    }

                    if (!allowedDays[sport].includes(day)) {
                        misuseCount++;
                        result.innerText = misuseCount === 1
                            ? `⚠️ 오늘은 ${sport} 종목을 사용할 수 없는 요일입니다. 다음에는 주의하세요!`
                            : `❌ 두 번째 위반입니다. 선도 조치를 받을 수 있습니다.`;
                        return;
                    }

                    result.innerText = `✅ ${sport} 클럽 활동으로 우선 입장 가능합니다.`;
                }
                displayIdCard(id);
                goEatBtn.style.display = "block";
                return;
            }

            const { hour, minute } = allowTimes[grade];
            const waitMinutes = minutesUntil(hour, minute);
            const nowTotal = current.hours * 60 + current.minutes;
            const allowedTotal = hour * 60 + minute;

            if (grade === "1") {
                // 항상 허용
            } else if (grade === "2") {
                if (nowTotal < allowedTotal) {
                    result.innerText = `⏳ 아직 2학년 입장 시간이 아닙니다. ${waitMinutes}분 남았습니다.`;
                    return;
                }
            } else if (grade === "3") {
                if (nowTotal < allowedTotal) {
                    result.innerText = `⏳ 아직 3학년 입장 시간이 아닙니다. ${waitMinutes}분 남았습니다.`;
                    return;
                }
            }

            if (grade === "1" && nowTotal < (13 * 60 + 10)) {
                result.innerText = `⏳ 아직 1학년 입장 시간이 아닙니다. ${minutesUntil(13, 10)}분 남았습니다.`;
                return;
            }

            if ((grade === "1" || grade === "2") && nowTotal < (13 * 60) && grade !== "3") {
                resetBackground();
                result.innerText = "❌ 지금은 3학년만 입장 가능합니다.";
                return;
            }

            if (grade === "1" && nowTotal < (13 * 60 + 6)) {
                resetBackground();
                result.innerText = "❌ 지금은 2학년도 아직 입장할 수 없습니다.";
                return;
            }

            result.innerText = `✅ ${grade}학년입니다. 입장 가능합니다.`;
            displayIdCard(id);
            goEatBtn.style.display = "block";
        }

        function displayIdCard(id) {
            const idCard = document.getElementById("idCard");

            let student = studentData[id];
            if (!student) {
                const classNum = parseInt(id.charAt(2));
                let department = "미확인";
                let imageRange = [];

                if ([1, 2].includes(classNum)) {
                    department = "AI융합전자과";
                    imageRange = [19, 20, 21];
                } else if ([3, 4].includes(classNum)) {
                    department = "스마트자동화과";
                    imageRange = [13, 14, 15];
                } else if ([5, 6].includes(classNum)) {
                    department = "디자인콘텐츠과";
                    imageRange = [7, 8, 9];
                } else if ([7, 8].includes(classNum)) {
                    department = "IT소프트웨어과";
                    imageRange = [1, 2, 3];
                }

                const imgNum = imageRange[Math.floor(Math.random() * imageRange.length)];
                const name = randomNames[Math.floor(Math.random() * randomNames.length)];
                student = { name, department, image: `image/학생-${imgNum}.png` };
            }

            idCard.innerHTML = `
                <div class="id-card">
                    <h3>학생증</h3>
                    <img src="${student.image}" alt="${student.name}">
                    <p><strong>이름:</strong> ${student.name}</p>
                    <p><strong>학번:</strong> ${id}</p>
                    <p><strong>학과:</strong> ${student.department}</p>
                </div>
            `;
        }

        const studentData = {
            "30712": { name: "이소현", grade: "3학년", department: "IT소프트웨어과", image: "image/학생-1.png" },
        };

        const randomNames = ["김민준", "이서윤", "박지우", "최하늘", "정예준", "한지민", "윤도윤", "장서연", "홍지호", "백하람"];
        function goToLunch() {
            // 여기에 이동할 URL을 입력하세요
            location.href = "http://127.0.0.1:5500/Student%20ID/index.html"; // ← 원하는 주소로 바꾸세요
        }

        localStorage.removeItem("usedIds");

        function isEligibleToEnter(student) {
            const now = new Date();
            const hour = now.getHours();
            const minute = now.getMinutes();
            const time = hour * 60 + minute; // 분 단위로 계산

            // 급식 우선권 처리 먼저
            if (student.priority) return { allowed: true, message: "🍽️ 우선권이 있어 바로 입장 가능합니다." };

            const grade = parseInt(student.grade);
            const department = student.department;

            if (grade === 3) {
                if (time >= 780 && time < 782 && department.includes("전자")) return { allowed: true };
                if (time >= 782 && time < 784 && department.includes("스마트")) return { allowed: true };
                if (time >= 784 && time < 786 && department.includes("디자인")) return { allowed: true };
                if (time >= 786 && time < 788 && department.includes("소프트")) return { allowed: true };
                if (time >= 789) return { allowed: true }; // 13:09 이후 자유 입장
                return { allowed: false, message: `⏱️ 아직 입장 시간이 아닙니다. ${minutesLeft(time)}분 남았습니다.` };
            }

            if (grade === 2) {
                if (time >= 789 && time < 792) return { allowed: true }; // 공통 입장 시간
                if (time >= 790 && time < 792 && department.includes("전자")) return { allowed: true };
                if (time >= 792 && time < 794 && department.includes("스마트")) return { allowed: true };
                if (time >= 794 && time < 796 && department.includes("디자인")) return { allowed: true };
                if (time >= 796 && time < 798 && department.includes("소프트")) return { allowed: true };
                return { allowed: false, message: `⏱️ 아직 입장 시간이 아닙니다. ${minutesLeft(time)}분 남았습니다.` };
            }
            if (grade === 1) {
                if (time >= 799 && time < 800) return { allowed: true }; // 공통 입장 시간
                if (time >= 801 && time < 802 && department.includes("전자")) return { allowed: true };
                if (time >= 803 && time < 804 && department.includes("스마트")) return { allowed: true };
                if (time >= 805 && time < 806 && department.includes("디자인")) return { allowed: true };
                if (time >= 807 && time < 808 && department.includes("소프트")) return { allowed: true };
                return { allowed: false, message: `⏱️ 아직 입장 시간이 아닙니다. ${minutesLeft(time)}분 남았습니다.` };
            }
        }

        function minutesLeft(currentTime) {
            const nextSlot = [780, 782, 784, 786, 788, 789, 790, 792, 794, 796, 798, 799, 800, 801, 802, 803, 804, 805, 806, 807, 808].find(t => t > currentTime);
            return nextSlot ? nextSlot - currentTime : 0;
        }

    </script>
</body>

</html>
