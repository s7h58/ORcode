<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>OR 찍고 밥먹자</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #ece9e6, #ffffff);
            transition: background-color 0.5s ease;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            transition: background-color 0.5s ease;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 16px;
        }

        input {
            border: 2px solid #ccc;
        }

        input:focus {
            border-color: #4A90E2;
            outline: none;
        }

        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #357ABD;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .id-card {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background-color: #f9f9f9;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .id-card img {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            float: right;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            text-decoration: none;
            color: #4A90E2;
            margin: 0 10px;
        }
    </style>
</head>

        };

        function checkGrade() {
            const id = document.getElementById("studentId").value.trim();
            const result = document.getElementById("result");
            const idCard = document.getElementById("idCard");
            const body = document.body;
            const card = document.getElementById("card");

            idCard.innerHTML = ""; // 초기화

            const resetBackground = () => {
                body.style.background = "#ffe6e6";
                card.style.backgroundColor = "#fff0f0";
            };

            if (!/^\d{5}$/.test(id)) {
                resetBackground();
                result.innerText = "❌ 학번은 정확히 5자리 숫자여야 합니다.";
                return;
            }

            const grade = id.charAt(0);
            if (!['1', '2', '3'].includes(grade)) {
                resetBackground();
                result.innerText = "❌ 첫 번째 자리는 1, 2, 또는 3이어야 합니다.";
                return;
            }

            if (id.charAt(1) !== '0') {
                resetBackground();
                result.innerText = "❌ 두 번째 자리는 반드시 0이어야 합니다.";
                return;
            }

            if (usedIds.has(id)) {
                resetBackground();
                result.innerText = "⚠️ 오타 또는 중복된 학번입니다. 다시 확인해주세요.";
                return;
            }

            usedIds.add(id);

            if (grade === "3") {
                body.style.background = "#D0E6FF";
                card.style.backgroundColor = "#E6F0FF";
                result.innerText = "🔵 3학년입니다. 먼저 식사하세요!";
            } else if (grade === "2") {
                body.style.background = "#FFE6C7";
                card.style.backgroundColor = "#FFF3E0";
                result.innerText = "🟠 2학년입니다. 다음 차례입니다.";
            } else {
                body.style.background = "#F0F0F0";
                card.style.backgroundColor = "#FAFAFA";
                result.innerText = "⚪ 1학년입니다. 마지막 차례입니다.";
            }

            // 학생증 표시
            // 학생증 표시
            const randomNames = ["김민준", "이서윤", "박지우", "최하늘", "정예준", "한지민", "윤도윤", "장서연", "홍지호", "백하람","오세훈", "강민서", "신유진", "이준호", "최수빈", "정하늘", "박상현", "김지우", "이수정", "최영수", "한지우"];

            if (studentData[id]) {
                const student = studentData[id];
                idCard.innerHTML = `
        <div class="id-card">
            <h3> 학생증</h3>
            <img src="${student.image}" alt="${student.name}">
            <p><strong>이름:</strong> ${student.name}</p>
            <p><strong>학번:</strong> ${id}</p>
            <p><strong>학과:</strong> ${student.department}</p>
        </div>
    `;
            } else {
                const classNum = parseInt(id.charAt(2));
                let department = "미확인";
                let imageRange = [];

                if (classNum === 1 || classNum === 2) {
                    department = "AI융합전자과";
                    imageRange = [19, 20, 21, 22, 23, 24];
                } else if (classNum === 3 || classNum === 4) {
                    department = "스마트자동화과";
                    imageRange = [13, 14, 15, 16, 17, 18];
                } else if (classNum === 5 || classNum === 6) {
                    department = "디자인콘텐츠과";
                    imageRange = [7, 8, 9, 10, 11, 12];
                } else if (classNum === 7 || classNum === 8) {
                    department = "IT소프트웨어과";
                    imageRange = [1, 2, 3, 4, 5, 6];
                }

                const randomImageNum = imageRange[Math.floor(Math.random() * imageRange.length)];
                const randomImage = `image/학생-${randomImageNum}.png`;
                const randomName = randomNames[Math.floor(Math.random() * randomNames.length)];

                idCard.innerHTML = `
        <div class="id-card">
            <h3> 학생증</h3>
            <img src="${randomImage}" alt="랜덤 학생">

            <p><strong>학번:</strong> ${id}</p>
