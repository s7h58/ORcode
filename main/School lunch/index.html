<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>📌 급식 입장 안내</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #f9f9f9, #e0f7fa);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 20px;
    }

    .info {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      max-width: 700px;
      width: 100%;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #0077aa;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .table th, .table td {
      padding: 10px 14px;
      border: 1px solid #ccc;
      text-align: center;
    }

    .table th {
      background-color: #e0f0ff;
      font-weight: bold;
    }

    .highlight {
      background-color: #d0f0ff;
    }

    .note {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .table th, .table td {
        padding: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>🍽️ 급식 입장 안내</h1>
  <div class="info">
    <div class="section">
      <h2>학년별 입장 시작 시간</h2>
      <table class="table">
        <tr><th>학년</th><th>입장 시작 시간</th></tr>
        <tr><td>3학년</td><td>13:00</td></tr>
        <tr><td>2학년</td><td>13:06</td></tr>
        <tr><td>1학년</td><td>13:10</td></tr>
      </table>
      <p class="note">각 과는 학년 내에서 3분 간격으로 순차 입장합니다.</p>
    </div>

    <div class="section">
      <h2>📅 월별 입장 순서 (과 기준)</h2>
      <table class="table">
        <tr>
          <th>월</th>
          <th>1순위</th>
          <th>2순위</th>
          <th>3순위</th>
          <th>4순위</th>
        </tr>
        <tr class="highlight">
          <td>3월</td>
          <td>전자과</td>
          <td>스마트과</td>
          <td>디자인과</td>
          <td>소프트과</td>
        </tr>
        <tr>
          <td>4월</td>
          <td>스마트과</td>
          <td>디자인과</td>
          <td>소프트과</td>
          <td>전자과</td>
        </tr>
        <tr class="highlight">
          <td>5월</td>
          <td>디자인과</td>
          <td>소프트과</td>
          <td>전자과</td>
          <td>스마트과</td>
        </tr>
        <tr>
          <td>6월</td>
          <td>소프트과</td>
          <td>전자과</td>
          <td>스마트과</td>
          <td>디자인과</td>
        </tr>
      </table>
      <p class="note">매달 순환하며 순위가 바뀝니다. 지난달 먼저 입장한 과는 이번 달엔 마지막!</p>
    </div>

  </div>
</body>
</html>
