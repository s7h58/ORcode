<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생증</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    .card-container {
      width: 300px;
      height: 500px;
      perspective: 1200px;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 1s;
      transform-style: preserve-3d;
      border-radius: 16px;
      cursor: pointer;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-front {
      background: #fff;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-back {
      transform: rotateY(180deg);
      position: relative;
    }

    .card-back img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .card-back .barcode {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 50px;
      background: repeating-linear-gradient(90deg, #000, #000 2px, #fff 2px, #fff 4px);
      z-index: 1;
    }

    .message {
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .home-button {
      padding: 10px 20px;
      font-size: 1rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .home-button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>
  <div class="message">식사 전 바코드를 찍어주세요!</div>

  <div class="card-container" id="card-container">
    <div class="card" id="card">
      <!-- 앞면 -->
      <div class="card-face card-front">
        <img src="image/학생-1.png" alt="학생증 앞면" />
      </div>

      <!-- 뒷면 -->
      <div class="card-face card-back">
        <img src="image/뒤면-1.png" alt="학생증 뒷면" />
      </div>
    </div>
  </div>

  <button class="home-button" onclick="location.href='http://127.0.0.1:5500/home/index.html'">홈으로 돌아가기</button>

  <script>
    const card = document.getElementById('card');
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints;

    if (isTouchDevice) {
      card.addEventListener('click', () => {
        card.classList.toggle('is-flipped');
      });
    } else {
      const container = document.getElementById('card-container');
      container.addEventListener('mouseenter', () => {
        card.classList.add('is-flipped');
      });
      container.addEventListener('mouseleave', () => {
        card.classList.remove('is-flipped');
      });
    }
  </script>
</body>

</html>
