<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생증 애니메이션</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .card-container {
      width: 300px;
      height: 500px;
      perspective: 1200px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 1s;
      transform-style: preserve-3d;
      border-radius: 16px;
    }

    .card-container:hover .card {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-front {
      background: #fff;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

.card-back {
  transform: rotateY(180deg);
  position: relative;
  overflow: hidden;
}

.card-back .back-image {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.card-back .barcode {
  position: relative;
  z-index: 1;
  margin-top: auto;
  margin-bottom: 30px;
  width: 220px;
  height: 50px;
  background: repeating-linear-gradient(90deg, #000, #000 2px, #fff 2px, #fff 4px);
}

  </style>
</head>

<body>
  <div class="card-container">
    <div class="card">
      <!-- 앞면: 업로드된 이미지 -->
      <div class="card-face card-front">
        <img src="image/학생-1.png" alt="학생증 앞면" />
      </div>

      <!-- 뒷면: 바코드 + 정보 -->
      <div class="card-face card-back">
        <img src="image/뒤면-1.png" alt="">
      </div>
    </div>
  </div>
</body>

</html>
